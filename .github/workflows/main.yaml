name: Reactjs Deployment

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            cd /services/QuanLyBenXe
            git fetch origin
            git checkout production
            git pull
            sudo docker build -t qlbxnmq .
            sudo docker ps -q -f name=qlbxnmq && sudo docker stop qlbxnmq && sudo docker rm qlbxnmq || true
            sudo docker run -d --name qlbxnmq -p 4000:3000 qlbxnmq
